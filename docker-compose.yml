# Production-like stack: PostgreSQL 17 + the app (client + API on one origin).
#   docker compose up --build
# Put HTTPS in front of it (Caddy example in docs/server.md): cookies are Secure in production.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: pokefocus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (e.g. openssl rand -hex 24)}
      POSTGRES_DB: pokefocus
    # Límites de recursos: un fallo del servidor no puede dejar sin memoria ni CPU a PostgreSQL ni al resto del equipo.
    # Ajusta DB_MEM_LIMIT / DB_CPUS a tu máquina (ver docs/server.md, «Límites de recursos»).
    mem_limit: ${DB_MEM_LIMIT:-2g}
    cpus: ${DB_CPUS:-2}
    # Logs rotados: sin esto crecen sin límite y pueden llenar el disco.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pokefocus -d pokefocus']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgres://pokefocus:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (e.g. openssl rand -hex 24)}@db:5432/pokefocus
      # Public URL(s) of the site, comma-separated (CSRF Origin check).
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8787}
      # 1 when a reverse proxy (Caddy) sits in front: client IP from X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # 0 only for plain HTTP inside an encrypted network (e.g. http://<tailscale-ip>:8787).
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      # Password pepper (npm run pepper). Required: the server refuses to start without it.
      # Back it up apart from the database; losing it locks every account out.
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?Set PASSWORD_PEPPER in .env (generate one with npm run pepper)}
      PASSWORD_PEPPER_PREVIOUS: ${PASSWORD_PEPPER_PREVIOUS:-}
      # Event images (admin uploads, re-encoded by sharp): the `uploads` volume. Back it up together with
      # the database (pg_dump alone does not contain the images).
      UPLOADS_DIR: /app/.data/uploads
      # Emails promoted to role admin at start-up (the accounts must exist).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Bearer token of the admin API (maintenance notices); empty = admin API off. Min. 24 chars.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Web Push keys (npm run vapid). All three or none; none = push notifications off.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Protecciones de carga (ver docs/server.md): conexiones SSE por jugador y totales, y peticiones simultáneas
      # máximas antes de responder 503 «servidor ocupado».
      MAX_SSE_PER_USER: ${MAX_SSE_PER_USER:-6}
      MAX_SSE_TOTAL: ${MAX_SSE_TOTAL:-10000}
      MAX_INFLIGHT: ${MAX_INFLIGHT:-400}
    # Límites de recursos: el servidor no puede quedarse con toda la RAM o la CPU del equipo. Cada conexión SSE
    # cuesta ~200 KB, así que MAX_SSE_TOTAL=10000 son ~2 GB: APP_MEM_LIMIT debe dejar margen.
    mem_limit: ${APP_MEM_LIMIT:-3g}
    cpus: ${APP_CPUS:-2}
    # Logs rotados: sin esto crecen sin límite y pueden llenar el disco.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    volumes:
      - uploads:/app/.data/uploads
    ports:
      # Host side: APP_BIND (default 127.0.0.1 = only this machine; put an HTTPS proxy
      # such as Caddy or `tailscale serve` in front) and APP_PORT (default 8787).
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-8787}:8787'

volumes:
  pgdata:
  uploads:
